<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход администратора</title>
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body class="container">

<header class="site-header"><a class="brand" href="index.html">Сладкие сны</a></header>

<main class="form-panel my-4" style="max-width:520px;margin:auto!important">
  <h1 class="h3">Вход администратора</h1>
  <div id="error" class="alert alert-danger d-none"></div>
  <form id="loginForm">
    <label class="form-label">Логин</label>
    <input class="form-control mb-3" name="username" required>
    <label class="form-label">Пароль</label>
    <input class="form-control mb-3" type="password" name="password" required>
    <button class="btn btn-primary w-100">Войти</button>
  </form>
  <p class="muted small mt-3 mb-0">Доступ только для администратора.</p>
</main>

<script src="js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const u = fd.get('username'), p = fd.get('password');
  const err = document.getElementById('error');
  if(u === 'hotel123' && p === 'adminHotel'){
    sessionStorage.setItem('admin','1');
    location.href = 'admin.html';
  } else {
    err.textContent = 'Неверный логин или пароль.';
    err.classList.remove('d-none');
  }
});
</script>
</body>
</html>
