<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сладкие сны — каталог номеров</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body class="container">
<header class="site-header d-flex flex-wrap align-items-center justify-content-between gap-2">
  <a class="brand" href="index.html">Сладкие сны</a>
  <span class="muted">Приезжайте как гости, уезжайте как друзья!</span>
  <nav><a class="btn btn-outline-secondary btn-sm" href="login.html">Вход администратора</a></nav>
</header>

<section class="hero">
  <h1>Каталог номеров</h1>
  <p class="mb-0">Выберите номер для комфортного отдыха. Цены указаны за сутки.</p>
</section>

<form class="panel p-3 mb-4 d-flex flex-wrap align-items-end gap-2" id="filterForm">
  <div>
    <label class="form-label" for="category">Категория номера</label>
    <select class="form-select" id="category" name="category">
      <option value="0">Все категории</option>
      <option value="1">Стандарт</option>
      <option value="2">Комфорт</option>
      <option value="3">Люкс</option>
      <option value="4">Семейный</option>
    </select>
  </div>
  <button class="btn btn-primary" type="submit">Применить</button>
  <a class="btn btn-outline-secondary" href="index.html">Сбросить фильтр</a>
</form>

<div class="row g-4" id="roomsGrid"></div>

<footer class="d-flex flex-wrap justify-content-between gap-3 mt-4">
  <span>Москва, ул. Ивовая, 48</span>
  <span>Пн–Пт, 8:00–17:00</span>
  <a href="tel:88005553535">8 (800) 555-35-35</a>
  <a href="mailto:обращения@СветлыеСны.рф">обращения@СветлыеСны.рф</a>
</footer>

<script>
const ROOMS = [
  {id:1, name:"Стандарт 101", category:"Стандарт", categoryId:1, price:3000,
   image:"https://picsum.photos/seed/room101/600/400",
   desc:"Односпальная кровать; Wi-Fi; ТВ; кондиционер; душ"},
  {id:2, name:"Стандарт 102", category:"Стандарт", categoryId:1, price:3000,
   image:"https://picsum.photos/seed/room102/600/400",
   desc:"Двуспальная кровать; Wi-Fi; ТВ; кондиционер; душ"},
  {id:3, name:"Стандарт 103", category:"Стандарт", categoryId:1, price:3200,
   image:"https://picsum.photos/seed/room103/600/400",
   desc:"Две раздельные кровати; Wi-Fi; ТВ; кондиционер; душ"},
  {id:4, name:"Комфорт 201", category:"Комфорт", categoryId:2, price:4500,
   image:"https://picsum.photos/seed/room201/600/400",
   desc:"King-size кровать; мини-бар; сейф; халат; ванна"},
  {id:5, name:"Комфорт 202", category:"Комфорт", categoryId:2, price:4500,
   image:"https://picsum.photos/seed/room202/600/400",
   desc:"King-size кровать; рабочий стол; мини-бар; балкон"},
  {id:6, name:"Люкс 301", category:"Люкс", categoryId:3, price:7000,
   image:"https://picsum.photos/seed/room301/600/400",
   desc:"Гостиная + спальня; джакузи; панорамный вид; халат; тапочки"},
  {id:7, name:"Люкс 302", category:"Люкс", categoryId:3, price:7500,
   image:"https://picsum.photos/seed/room302/600/400",
   desc:"Двухкомнатный; камин; сауна; мини-кухня; вид на парк"},
  {id:8, name:"Семейный 401", category:"Семейный", categoryId:4, price:5500,
   image:"https://picsum.photos/seed/room401/600/400",
   desc:"Двуспальная + детская кровать; кухня; детская ванна; Wi-Fi"},
  {id:9, name:"Семейный 402", category:"Семейный", categoryId:4, price:5800,
   image:"https://picsum.photos/seed/room402/600/400",
   desc:"Две спальни; гостиная; кухня; балкон; игровая зона"}
];

function fmt(n){ return n.toLocaleString('ru-RU')+' ₽'; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(catId){
  const grid = document.getElementById('roomsGrid');
  const list = catId ? ROOMS.filter(r=>r.categoryId===catId) : ROOMS;
  if(!list.length){ grid.innerHTML = '<div class="alert alert-info">Номера этой категории пока не добавлены.</div>'; return; }
  grid.innerHTML = list.map(r=>{
    const feats = r.desc.split(';').map(f=>`<li>${esc(f.trim())}</li>`).join('');
    return `
    <div class="col-md-6 col-lg-4">
      <article class="card room-card">
        <img src="${esc(r.image)}" class="card-img-top" alt="${esc(r.name)}">
        <div class="card-body">
          <span class="badge text-bg-secondary align-self-start">${esc(r.category)}</span>
          <h2 class="h4 mt-2">${esc(r.name)}</h2>
          <div class="fs-5 fw-bold mb-2">${fmt(r.price)} <small class="muted fs-6">/ сутки</small></div>
          <h3 class="h6">Характеристики</h3>
          <ul>${feats}</ul>
          <a class="btn btn-success" href="booking.html?room=${r.id}">Забронировать</a>
        </div>
      </article>
    </div>`;
  }).join('');
}

document.getElementById('filterForm').addEventListener('submit', e=>{
  e.preventDefault();
  const cat = parseInt(document.getElementById('category').value,10);
  render(cat||0);
});

// автофильтр по query-параметру ?category=N
const params = new URLSearchParams(location.search);
const initCat = parseInt(params.get('category')||'0',10);
if(initCat){ document.getElementById('category').value = initCat; }
render(initCat);
</script>
</body>
</html>
