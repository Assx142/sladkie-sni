<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бронирование — Сладкие сны</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<style>
body{background:#fafafa;font-family:Arial,sans-serif}
.site-header,.form-panel,.debug-box{background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(23,43,77,.07)}
.site-header{margin:18px 0;padding:14px 22px}
.brand{font-size:1.45rem;font-weight:700;color:#212529;text-decoration:none}
.form-panel{margin:24px 0;padding:24px}
.debug-box{margin:24px 0;padding:16px;font-size:.85rem;color:#666}
.debug-box pre{background:#f5f5f5;padding:10px;border-radius:6px;overflow:auto;max-height:200px}
footer{margin:30px 0 16px;padding:20px;background:#fff;border-radius:12px}
.muted{color:#6c757d}
</style>
</head>
<body class="container">

<header class="site-header d-flex justify-content-between align-items-center">
  <a class="brand" href="index.html">Сладкие сны</a>
  <a href="index.html" class="btn btn-outline-secondary btn-sm">← Каталог</a>
</header>

<main class="form-panel">
  <h1 class="h2">Бронирование номера</h1>
  <p id="roomInfo"></p>

  <div id="successBlock" class="alert alert-success d-none">
    ✅ <strong>Заявка сохранена!</strong> Теперь откройте <a href="admin.html">панель администратора</a> — она там появится.
    <br><br>
    <a class="btn btn-primary" href="index.html">Вернуться в каталог</a>
    <a class="btn btn-outline-primary" href="admin.html">Открыть админку →</a>
  </div>

  <div id="errorBlock" class="alert alert-danger d-none"></div>

  <form id="bookingForm" class="row g-3">
    <input type="hidden" name="room_id" id="room_id">
    <div class="col-md-6">
      <label class="form-label">Имя *</label>
      <input class="form-control" name="first_name" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Фамилия *</label>
      <input class="form-control" name="last_name" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Телефон *</label>
      <input class="form-control" name="phone" type="tel" placeholder="+7(999)123-45-67" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">E-mail *</label>
      <input class="form-control" type="email" name="email" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Дата заезда *</label>
      <input class="form-control" type="date" name="check_in" id="check_in" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Дата выезда *</label>
      <input class="form-control" type="date" name="check_out" id="check_out" required>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-success btn-lg">Отправить заявку</button>
    </div>
  </form>
</main>

<div class="debug-box">
  <strong>🔍 Отладка:</strong> заявок в хранилище: <span id="debugCount">0</span>
  <pre id="debugData">[]</pre>
  <button class="btn btn-sm btn-outline-danger" onclick="if(confirm('Удалить все заявки?')){localStorage.removeItem('hotel_bookings');location.reload();}">Очистить все заявки</button>
</div>

<footer>Москва, ул. Ивовая, 48 · Пн–Пт, 8:00–17:00 · 8 (800) 555-35-35</footer>

<script>
const ROOMS = {
  1:{name:"Стандарт 101",category:"Стандарт",price:3000},
  2:{name:"Стандарт 102",category:"Стандарт",price:3000},
  3:{name:"Стандарт 103",category:"Стандарт",price:3200},
  4:{name:"Комфорт 201",category:"Комфорт",price:4500},
  5:{name:"Комфорт 202",category:"Комфорт",price:4500},
  6:{name:"Люкс 301",category:"Люкс",price:7000},
  7:{name:"Люкс 302",category:"Люкс",price:7500},
  8:{name:"Семейный 401",category:"Семейный",price:5500},
  9:{name:"Семейный 402",category:"Семейный",price:5800}
};

function today(){ return new Date().toISOString().slice(0,10); }
function tomorrow(){ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }

function updateDebug(){
  const data = JSON.parse(localStorage.getItem('hotel_bookings') || '[]');
  document.getElementById('debugCount').textContent = data.length;
  document.getElementById('debugData').textContent = JSON.stringify(data, null, 2);
}

const params = new URLSearchParams(location.search);
const roomId = parseInt(params.get('room')||'1',10);
const room = ROOMS[roomId] || ROOMS[1];

document.getElementById('roomInfo').innerHTML =
  `<strong>${room.name}</strong> · ${room.category} · ${room.price.toLocaleString('ru-RU')} ₽/сутки`;
document.getElementById('room_id').value = roomId;
document.getElementById('check_in').min = today();
document.getElementById('check_out').min = tomorrow();

updateDebug();

document.getElementById('bookingForm').addEventListener('submit', function(e){
  e.preventDefault();
  const fd = new FormData(this);
  const first = fd.get('first_name').trim();
  const last  = fd.get('last_name').trim();
  const phone = fd.get('phone').trim();
  const email = fd.get('email').trim();
  const inD   = fd.get('check_in');
  const outD  = fd.get('check_out');

  if(!first || !last) return alert('Введите имя и фамилию');
  if(!phone) return alert('Введите телефон');
  if(!email) return alert('Введите email');
  if(!inD || inD < today()) return alert('Дата заезда не может быть раньше сегодняшней');
  if(!outD || outD <= inD) return alert('Дата выезда должна быть позже даты заезда');

  const bookings = JSON.parse(localStorage.getItem('hotel_bookings') || '[]');
  bookings.push({
    id: Date.now(),
    room_id: roomId,
    room: room.name,
    category: room.category,
    first_name: first,
    last_name: last,
    phone: phone,
    email: email,
    check_in: inD,
    check_out: outD,
    status: 'pending',
    created_at: new Date().toISOString()
  });
  localStorage.setItem('hotel_bookings', JSON.stringify(bookings));

  this.style.display = 'none';
  document.getElementById('successBlock').classList.remove('d-none');
  updateDebug();
});
</script>
</body>
</html>
